; Oricutron pour le web (CP/A) : ROMs et disquette dans /readwritefs, la
; mémoire du navigateur (IndexedDB), remplie par la page.
machine = atmos
disktype = microdisc
atmosrom = '/readwritefs/roms/basic11b'
mdiscrom = '/readwritefs/roms/microdis'
diskimage = '/readwritefs/cpa.dsk'
diskautosave = yes
rendermode = soft
statusbarmode = full
show_keyboard = yes
sticky_mod_keys = yes
