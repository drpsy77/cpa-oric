# Vérifie que les documents traduits (docs/en/) suivent les originaux
# (tools/check_en.py : titres, tableaux, exemples), à chaque envoi qui
# touche les documents.
name: Documents

on:
  workflow_dispatch:
  push:
    branches: [main]      # pas à l'envoi d'une étiquette
    paths:
      - docs/**
      - tools/check_en.py
      - .github/workflows/docs.yml

jobs:
  traductions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traductions à jour
        run: python3 tools/check_en.py
