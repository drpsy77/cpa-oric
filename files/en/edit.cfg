; EDIT.CFG : EDIT settings per
; file. The first line whose
; name matches applies
; (wildcards * and ?).
;
; name   max  wrap    printer
;  max : longest paragraph
;    (0 : no limit) ; beyond,
;    C nnn! on the status line,
;    ^L : next one too long
;  wrap on screen : WORDS, CHAR
;    or LINE (one line per
;    paragraph, scrolling)
;  printer : width (80)
;
*.LOG    126  LINE  80
*.BAT    78   LINE  80
*.ASM    0    LINE  80
*.GRX    0    LINE  80
*.*      0    WORDS 80
