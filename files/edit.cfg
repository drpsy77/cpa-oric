; EDIT.CFG : reglages d'EDIT
; par fichier. La premiere ligne
; dont le nom correspond
; s'applique (jokers * et ?).
;
; nom    maxi coupure imprimante
;  maxi : longueur maxi d'un
;    paragraphe (0 : sans limite) ;
;    au-dela, C nnn! sur la ligne
;    d'etat, ^L : trop long suivant
;  coupure a l'ecran : MOTS, CAR
;    ou LIGNE (une ligne par
;    paragraphe, defilement)
;  imprimante : largeur (80)
;
*.LOG    126  LIGNE 80
*.BAT    78   LIGNE 80
*.ASM    0    LIGNE 80
*.GRX    0    LIGNE 80
*.*      0    MOTS  80
